[package]
name = "dsk"
description = "The tectr desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine.workspace = true
highlight.workspace = true
protocol.workspace = true
settings.workspace = true

arboard = { version = "3", default-features = false }
dirs.workspace = true
notify = "8"
open = "5"
serde.workspace = true
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["macros", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# The workspace's lints, except `unsafe_code` is `deny` instead of `forbid`, because
# nothing can allow a `forbid`. `color_title_bar` in src/main.rs is the only exception.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
