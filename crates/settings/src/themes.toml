# The themes that come with the app, in the same format as a theme in the settings file.
#
# These are each theme's published colors. Where one would be unreadable here, it's moved
# just far enough and the published color is kept as a comment: text and status colors reach
# WCAG AA (4.5:1) and syntax colors reach 3:1. A test in appearance.rs holds them to that.

# tectr's own themes come first. Their values match design/tokens, which a test checks, and
# leaving a color out means it's worked out from the others by the rules in appearance.rs.

[tectr-dark]
name = "Tectr Dark"
mode = "dark"
"surface.base" = "#09080c"
