[package]
name = "fake-agent"
description = "A scripted ACP agent, so tests need no Claude credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["stdio", "unstable_session_fork", "unstable_session_system_prompt"] }
# Plain HTTP is enough: it only ever calls the daemon's loopback proxy.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
base64.workspace = true
sha2.workspace = true
engine.workspace = true
daemon.workspace = true
protocol.workspace = true

bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
iroh.workspace = true
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true
serde_json.workspace = true

[lints]
workspace = true
