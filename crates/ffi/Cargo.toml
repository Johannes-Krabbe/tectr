[package]
name = "ffi"
description = "The engine for the iOS app, through Swift bindings generated by UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Not `ffi`, which would build `libffi` and clash with the system library of that name.
name = "tectr_ffi"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only the bindings generator needs UniFFI's command line, so the library builds without it.
bindgen = ["uniffi/cli"]

[dependencies]
engine.workspace = true
protocol.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

# iroh's network interface crate, netdev, uses `in6_ifreq` on iOS, which libc 0.2.190 made
# macOS only. Lift this once a netdev release builds for iOS against the newest libc.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[lints]
workspace = true
