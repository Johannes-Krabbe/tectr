[package]
name = "daemon"
description = "Runs on each machine, owns its workspaces and sessions, and drives agents over ACP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tectr-daemon"
path = "src/main.rs"

[dependencies]
protocol.workspace = true

agent-client-protocol = { workspace = true, features = ["process", "unstable_session_fork"] }
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
image.workspace = true
# Ghostty's terminal engine keeps each terminal's screen, so a client attaching or falling
# behind gets the screen as it is instead of a replay. Building it needs Zig (see mise.toml).
# The bindings on crates.io predate libghostty-vt 1.0, so this pins the revision that builds
# its vt-1.0.0 release.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "768add93c54ccdba3f5c4d8763789ab6416f3151", default-features = false }
# Terminals: pseudo terminals, and the session their shells start in.
rustix = { version = "1.1", features = ["fs", "process", "pty", "std", "termios"] }
reqwest.workspace = true
rusqlite.workspace = true
# Codex compresses older conversations with zstd. Pure Rust, so nothing more to build.
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
iroh.workspace = true
# Parses the timestamps in Claude Code and Codex conversations.
jiff = { version = "0.2", default-features = false, features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
