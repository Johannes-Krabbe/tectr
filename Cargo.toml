[workspace]
resolver = "3"
members = ["crates/*", "apps/dsk/src-tauri"]
# Plain cargo commands skip the desktop app, which needs a built frontend and,
# on Linux, WebKit. That would otherwise break daemon builds on a VPS.
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
engine = { path = "crates/engine" }
settings = { path = "crates/settings" }
daemon = { path = "crates/daemon" }
highlight = { path = "crates/highlight" }

agent-client-protocol = "5.0.0"
anyhow = "1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Rustls rather than the system's TLS, so a daemon on Linux needs no OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "form"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
# No TLS: connections are loopback today and Tailscale-encrypted later.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
