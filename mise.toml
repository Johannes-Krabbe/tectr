[tools]
# Builds Ghostty's terminal engine, which the daemon's terminals use. Ghostty pins the version.
zig = "0.17.1"
# The Claude adapter needs Node 22+ on every machine that runs a daemon.
node = "22"
pnpm = "11.28.9"
xcodegen = "2.46.0"

[tasks.test]
description = "Run all tests, including daemon and client end-to-end tests against the fake agent"
run = "cargo test"

[tasks.lint]
run = ["cargo fmt --all --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.daemon]
description = "Run the daemon on loopback"
run = "cargo run -p daemon --"

[tasks.dsk]
description = "Run the desktop app in development"
dir = "apps/dsk"
run = "pnpm tauri dev"

[tasks."dsk:test"]
description = "Test the desktop app's logic: shortcuts, appearance, navigation and markdown"
run = "node --experimental-strip-types --test apps/dsk/src/*.test.ts"

[tasks.ios]
description = "Generate the Xcode project, then open apps/ios/Tectr.xcodeproj"
dir = "apps/ios"
run = "xcodegen generate"

[tasks.tokens]
description = "Regenerate design tokens and icons for both apps"
run = "node design/tokens/build.mjs"

[tasks."tokens:test"]
description = "Check tokens, contrast, fixtures, logo files, and that app code has no raw colors"
run = "node --test design/tokens/tokens.test.mjs design/logo/logo.test.mjs"

[tasks.logo]
description = "Regenerate the logo files in design/logo and copy the app icons into both apps"
run = "node design/logo/build.mjs"

[tasks.tectr]
description = "Run the CLI, for example: mise run tectr status"
run = "cargo run -q -p cli --"

[tasks."release:build"]
description = "Build the release app, CLI and daemon into target/release-dist, publishing nothing"
run = "scripts/release.sh build"

[tasks.release]
description = "Bump, build, tag and publish to GitHub Releases and the Homebrew tap, for example: mise run release 0.2.0"
run = "scripts/release.sh publish"
