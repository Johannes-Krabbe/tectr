<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tectr · workspaces, topics and tabs (v3)</title>
<link rel="stylesheet" href="../v2/tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 100vh; min-width: 960px; }
  .app.noside:not(.hinting) { grid-template-columns: 0 minmax(0, 1fr); }
  .app.noside:not(.hinting) .side { visibility: hidden; }
  .app.noside:not(.hinting) .main { margin-left: 8px; }

  /* Shortcut badges appear only while the modifier is held */
  .hk { display: none; position: absolute; z-index: 3; align-items: center; height: 17px; padding: 0 4px; border-radius: 4px; background: var(--accent); color: #fff; font: 500 10.5px/1 var(--ui); }
  .reveal .hk { display: inline-flex; }
  .srow .hk { right: 28px; top: 6px; }
  .tab .hk { left: 50%; bottom: -9px; transform: translateX(-50%); }

  /* Sidebar */
  .side { display: flex; flex-direction: column; min-height: 0; padding: 12px 8px 8px; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px; font-weight: 600; }
  .logo { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; }
  .search { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 30px; padding: 0 8px; margin: 10px 0 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink-3); text-align: left; }
  .search kbd { background: none; color: var(--ink-3); padding: 0; }
  .tree { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .srow { position: relative; display: flex; align-items: center; gap: 9px; width: 100%; height: 29px; padding: 0 8px; border-radius: 6px; text-align: left; color: var(--ink-2); font-weight: 500; }
  .srow:hover { background: var(--surface); }
  .srow .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .meta { flex: none; font-size: 12px; font-weight: 450; color: var(--ink-3); }
  .srow .meta.alert { color: var(--waiting); font-weight: 500; }
  .srow .meta.bad { color: var(--failed); font-weight: 500; }
  .glyph { width: 14px; text-align: center; flex: none; color: var(--ink-3); }

  .wsrow { margin-top: 12px; height: 27px; color: var(--ink-3); font-size: 12.5px; }
  .wsrow .chev { width: 14px; flex: none; text-align: center; font-size: 9px; color: var(--ink-3); }
  .wsrow .name { color: var(--ink-2); font-weight: 600; }

  .topic { padding-left: 10px; font-weight: 450; color: var(--ink); }
  .topic.done .name, .topic.stale .name { color: var(--ink-3); }
  .topic.waiting { background: rgba(240, 182, 77, 0.07); }
  .topic.waiting:hover { background: rgba(240, 182, 77, 0.11); }

  /* The selected row: purple when the sidebar owns the keyboard, neutral otherwise */
  .srow.current { background: var(--surface-2); }
  .srow.current.waiting { background: rgba(240, 182, 77, 0.15); }
  .sidefocus .srow.current { background: var(--accent-tint); box-shadow: inset 0 0 0 1px rgba(124, 92, 240, 0.5); }
  @keyframes lamp-off { from { background-color: rgba(240, 182, 77, 0.3); } }
  .fade-off { animation: lamp-off 320ms ease-out; }

  .hint { display: none; flex: none; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent); color: #fff; font: 600 11px/1 var(--ui); text-transform: uppercase; }
  .hinting .hint { display: grid; }
  .hinting .topic .meta { display: none; }
  .hinting .srow:not(.topic) { opacity: 0.45; }

  .newtopic { display: flex; align-items: center; gap: 9px; height: 29px; padding: 0 8px 0 10px; border-radius: 6px; background: var(--accent-tint); box-shadow: inset 0 0 0 1px rgba(124, 92, 240, 0.5); }
  .newtopic input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: 450 13px/1 var(--ui); }
  .newtopic input::placeholder { color: var(--ink-3); opacity: 1; }

  .machines { flex: none; display: flex; gap: 12px; padding: 9px 8px 2px; margin-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .machines span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; }
  .dot.off { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-3); }

  /* Main panel */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 8px 8px 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .head { flex: none; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 16px; }
  .crumb { display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .crumb span { color: var(--ink-3); font-weight: 450; }
  .head .info { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
  .head .code { font: 400 11.5px/1 var(--code); }
  .ghost { flex: none; height: 26px; padding: 0 10px; border-radius: 6px; background: var(--surface-2); font-weight: 500; font-size: 12.5px; }

  /* Tabs: agents, diffs and terminals in one strip */
  .tabs { flex: none; display: flex; align-items: stretch; gap: 2px; height: 34px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .tab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 9px; color: var(--ink-3); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  .tab:hover { color: var(--ink-2); }
  .tab .tk { flex: none; width: 14px; text-align: center; font: 500 11px/1 var(--code); }
  .tab.waiting { color: var(--waiting); }
  .tab.failed { color: var(--failed); }
  .tab.shown { color: var(--ink); }
  .tab.shown::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 1.5px; background: var(--ink-3); }
  .tab.active::after { background: var(--accent-ink); }
  .tab .sub { color: var(--ink-3); font-weight: 450; font-size: 12px; }
  .addtab { position: relative; align-self: center; width: 24px; height: 24px; border-radius: 6px; color: var(--ink-3); font-size: 15px; line-height: 1; }
  .addtab:hover { background: var(--surface); color: var(--ink-2); }

  .picker { position: absolute; z-index: 5; width: 212px; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
  .picker div { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 7px; border-radius: 5px; color: var(--ink); }
  .picker kbd { margin-left: auto; }

  /* Panes */
  .panes { flex: 1; min-height: 0; display: flex; }
  .pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 1px solid var(--line); }

  /* Agent pane */
  .tracebar { flex: none; width: 100%; max-width: 800px; align-self: center; padding: 12px 20px 2px; }
  .tracebar .trace { height: 14px; }
  .axis { display: flex; justify-content: space-between; margin-top: 3px; font-size: 11px; color: var(--ink-3); }
  .log { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .log-in { display: flex; flex-direction: column; gap: 12px; min-height: 100%; max-width: 800px; margin: 0 auto; padding: 12px 20px 14px; }
  .log-in > :first-child { margin-top: auto; }
  .you { padding: 10px 12px; background: var(--surface); border-radius: 8px; line-height: 1.5; }
  .agent-msg { font-size: 13.5px; line-height: 1.55; }
  .tools { display: flex; flex-direction: column; gap: 5px; }
  .tool { display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .tool .k { flex: none; width: 30px; }
  .tool .p { flex: 1; min-width: 0; font: 400 11.5px/18px var(--code); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool .note { font-size: 12.5px; color: var(--ink-3); }
  .tool .m { flex: none; font-size: 12px; }
  .tool .m.bad { color: var(--failed); }
  .empty { margin: auto; color: var(--ink-3); text-align: center; }

  .diff { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; font: 400 11.5px/18px var(--code); background: var(--base); }
  .diff div { padding-left: 10px; white-space: pre; color: var(--ink-2); }
  .diff .a { background: var(--add-bg); color: var(--add-ink); }
  .diff .d { background: var(--del-bg); color: var(--del-ink); }
  .diff .h { color: var(--ink-3); padding-top: 3px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }

  .dock { flex: none; width: 100%; max-width: 800px; align-self: center; padding: 0 20px; }
  .decide { margin-bottom: 10px; padding: 12px; border-radius: 9px; background: rgba(240, 182, 77, 0.07); border: 1px solid rgba(240, 182, 77, 0.28); }
  .decide-top { display: flex; align-items: center; gap: 7px; font-weight: 500; color: var(--waiting); font-size: 12.5px; }
  .decide-top .pos { margin-left: auto; color: var(--ink-3); font-weight: 450; }
  .decide pre { margin-top: 8px; font: 400 12px/1.5 var(--code); white-space: pre-wrap; word-break: break-word; }
  .decide .q { margin-top: 7px; font-weight: 500; font-size: 13.5px; }
  .decide .why { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
  .actions { display: flex; align-items: center; gap: 6px; margin-top: 11px; }
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--surface-2); font-weight: 500; font-size: 12.5px; }
  .btn:hover { background: var(--line-strong); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn > * { position: relative; }
  .btn.primary::before { content: ""; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.28); transform: scaleX(0); transform-origin: left; }
  .btn.primary.holding::before { transform: scaleX(1); transition: transform 500ms linear; }
  .opts { display: flex; flex-direction: column; gap: 4px; margin-top: 9px; }
  .opt { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px 0 6px; border-radius: 6px; background: var(--surface-2); text-align: left; }
  .opt:hover { background: var(--line-strong); }

  .composer { display: flex; align-items: center; height: 38px; margin-bottom: 14px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
  .composer:focus-within { border-color: var(--accent-ink); }
  .composer input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: 450 13px/1 var(--ui); }
  .composer input::placeholder { color: var(--ink-3); opacity: 1; }

  /* Diff pane */
  .changes { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr); }
  .split .changes { grid-template-columns: minmax(0, 1fr); }
  .split .files { display: none; }
  .files { padding: 10px 8px; border-right: 1px solid var(--line); overflow: hidden; }
  .file { display: flex; gap: 8px; align-items: center; height: 26px; padding: 0 8px; border-radius: 5px; color: var(--ink-2); font: 400 11.5px/1 var(--code); }
  .file span:first-child { flex: 1; min-width: 0; direction: rtl; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .n { flex: none; color: var(--ink-3); font-size: 11px; }
  .file.on { background: var(--surface-2); color: var(--ink); }
  .hunks { min-height: 0; overflow-y: auto; padding: 12px 16px 16px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .fname { margin: 12px 0 6px; font: 400 11.5px/1.3 var(--code); color: var(--ink-3); }
  .fname:first-child { margin-top: 0; }
  .hunk { margin-bottom: 8px; }
  .hunk.on { outline: 1.5px solid var(--ink-3); outline-offset: -1px; }
  .pane.focused .hunk.on { outline-color: var(--accent-ink); }
  .pane > .dock.comment { padding-top: 10px; max-width: none; }

  /* Terminal pane */
  .term { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; background: var(--base); font: 400 12.5px/1.55 var(--code); color: var(--ink-2); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .term div { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; }
  .term .ok { color: var(--live); }
  .term .no { color: var(--failed); }
  .term .pr { color: var(--accent-ink); }
  .term .cmd { color: var(--ink); }
  .caret { display: inline-block; width: 0.6em; height: 1.15em; margin-left: 1px; vertical-align: text-bottom; box-shadow: inset 0 0 0 1px var(--ink-3); }
  .caret.live { background: var(--ink); box-shadow: none; }

  /* Inbox */
  .inbox { flex: 1; overflow-y: auto; padding: 8px 6px; }
  .inrow { display: grid; grid-template-columns: 14px minmax(160px, 260px) minmax(0, 1fr) auto; align-items: center; column-gap: 10px; width: 100%; height: 40px; padding: 0 10px; border-radius: 6px; text-align: left; }
  .inrow.on { background: rgba(240, 182, 77, 0.13); }
  .inrow .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .inrow .where span { color: var(--ink-3); font-weight: 450; }
  .inrow .what { font: 400 12px/1 var(--code); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inrow .age { color: var(--waiting); font-size: 12px; }

  /* Status line: who owns the keyboard, and what works right now */
  .foot { flex: none; display: flex; align-items: center; gap: 14px; height: 28px; padding: 0 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .foot .mode { font-weight: 600; color: var(--ink-2); }
  .foot .mode.typing { color: var(--accent-ink); }
  .foot span { display: inline-flex; align-items: center; gap: 4px; }
  .foot kbd { height: 16px; min-width: 16px; font-size: 10.5px; background: var(--surface-2); color: var(--ink-2); }
  .foot .flash { color: var(--ink); }
  .foot .right { margin-left: auto; }

  /* Overlays */
  .scrim { position: fixed; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; background: rgba(5, 4, 8, 0.55); }
  .palette { width: 580px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6); }
  .palette input { width: 100%; height: 44px; padding: 0 16px; background: none; border: 0; border-bottom: 1px solid var(--line-strong); outline: 0; color: var(--ink); font: 450 14.5px/1 var(--ui); }
  .palette input::placeholder { color: var(--ink-3); opacity: 1; }
  .pal-list { padding: 5px; max-height: 360px; overflow: hidden; }
  .pal { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; }
  .pal .sub { color: var(--ink-3); }
  .pal .kind { margin-left: auto; color: var(--ink-3); font-size: 12px; }
  .pal.on { background: var(--accent-tint); }
  .help { width: 760px; padding: 20px 22px 18px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6); }
  .help h3 { font: 600 15px/1.2 var(--ui); }
  .help > p { margin: 4px 0 14px; color: var(--ink-2); }
  .help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
  .help h4 { margin-bottom: 6px; font: 600 12px/1.3 var(--ui); color: var(--ink-3); }
  .help li { display: flex; justify-content: space-between; align-items: center; height: 24px; list-style: none; color: var(--ink-2); }
  .help li span { display: flex; gap: 3px; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>

<script>
// Prototype only: all data is fake and nothing talks to a daemon.
// Browsers reserve shortcuts like ⌘T and ⌘W, so ⌥ also triggers every ⌘ shortcut here.

const ICON = {
  idle: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="#7c7a89" stroke-width="1.5"/></svg>`,
  working: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="#b9a6ff" stroke-width="1.5"/><path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="#b9a6ff"/></svg>`,
  waiting: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="#f0b64d"/><rect x="4.6" y="4" width="1.7" height="6" rx=".6" fill="#0e0d12"/><rect x="7.7" y="4" width="1.7" height="6" rx=".6" fill="#0e0d12"/></svg>`,
  failed: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="#f0766e"/><path d="M4.8 4.8l4.4 4.4M9.2 4.8L4.8 9.2" stroke="#0e0d12" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  done: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="#7c7a89"/><path d="M4.2 7.2l2 2 3.6-4" fill="none" stroke="#0e0d12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  stale: `<svg class="status" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="#7c7a89" stroke-width="1.5" stroke-dasharray="2 2.2"/></svg>`,
};

let uid = 0;
function seed(str) { let h = 7; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return () => (h = (h * 1664525 + 1013904223) >>> 0) / 2 ** 32; }

function genTicks(id, tr) {
  const r = seed(id), { from, to = 0, d, waits = [], errs = [] } = tr, out = [];
  for (let t = from; t > to; t -= (0.3 + r() * 1.4) / d) {
    if (waits.some(([a, b]) => t <= a && t >= b)) continue;
    const v = r();
    out.push({ t, k: v < 0.5 ? 'r' : v < 0.8 ? 'b' : 'e' });
  }
  errs.forEach(t => out.push({ t, k: 'x' }));
  return out;
}

function agent(title, engine, state, secs, now, tr, extra = {}) {
  const id = `t${++uid}`;
  return { id, kind: 'agent', title, engine, state, secs, now, tr, ticks: tr ? genTicks(id + title, tr) : [], ...extra };
}
const changes = (files) => ({ id: `t${++uid}`, kind: 'diff', title: 'Changes', files, hunk: 0 });
const terminal = (title, lines, extra = {}) => ({ id: `t${++uid}`, kind: 'term', title, lines, input: '', ...extra });

const genericDiff = (path, add, del) => [{ path, add, del, hunks: [[
  ['h', '@@ 12,5 @@'], ['', '  pub fn run(&self) -> Result<()> {'],
  ['d', '-     self.legacy_path()'], ['a', '+     let state = self.load_state()?;'], ['a', '+     self.apply(state)'], ['', '  }'],
]] }];

const reconnectFiles = [
  { path: 'crates/tectr-client/src/connection.rs', add: 31, del: 9, hunks: [
    [['h', '@@ fn reconnect 84,9 @@'], ['', '  let mut attempt = 0u32;'], ['', '  loop {'], ['d', '-     sleep(Duration::from_secs(2)).await;'], ['a', '+     let delay = backoff(attempt, MAX_BACKOFF);'], ['a', '+     sleep(delay).await;'], ['', '      match self.connect(last_seq).await {'], ['d', '-         Ok(stream) => return Ok(stream),'], ['a', '+         Ok(stream) => {'], ['a', '+             self.flush_queue().await?;'], ['a', '+             return Ok(stream);'], ['a', '+         }']],
    [['h', '@@ fn backoff 142,0 @@'], ['a', '+ fn backoff(attempt: u32, max: Duration) -> Duration {'], ['a', '+     let base = Duration::from_millis(250) * 2u32.pow(attempt.min(8));'], ['a', '+     base.min(max) + jitter()'], ['a', '+ }']],
  ] },
  { path: 'crates/tectr-client/src/queue.rs', add: 6, del: 2, hunks: [
    [['h', '@@ impl ActionQueue 31,4 @@'], ['d', '-     self.items.clear();'], ['a', '+     // Keep queued actions across reconnect attempts'], ['a', '+     self.retry_count += 1;'], ['', '  }']],
  ] },
  { path: 'crates/tectr-client/tests/reconnect.rs', add: 1, del: 0, hunks: [
    [['h', '@@ 8,0 @@'], ['a', '+ const FIXTURE: &str = "fixtures/stale_session.json";']],
  ] },
];

const reconnectTerm = [
  ['pr', '~/wt/reconnect-backoff $ ', 'cargo test -p tectr-client reconnect'],
  ['', '   Compiling tectr-client v0.3.1'],
  ['', '    Finished test profile in 2.41s'],
  ['', '     Running tests/reconnect.rs'],
  ['ok', 'test backoff_caps_at_max ... ok'],
  ['ok', 'test resumes_from_last_seq ... ok'],
  ['no', 'test flushes_queue_after_connect ... FAILED'],
  ['', ''],
  ['no', 'test result: FAILED. 14 passed; 1 failed'],
];
const watchTerm = [
  ['pr', '~/wt/acp-spawn $ ', 'cargo watch -x "check -p tectr-daemon"'],
  ['', '[Running cargo check -p tectr-daemon]'],
  ['', '    Checking tectr-daemon v0.3.1'],
  ['ok', '    Finished dev profile in 1.18s'],
  ['', '[Finished running. Exit status: 0]'],
];

const LOG_RECONNECT = [
  ['you', 'Add exponential backoff to daemon reconnects in tectr-client. Resume from the last sequence number and don’t lose queued actions.'],
  ['agent', 'The reconnect loop in connection.rs retries on a fixed 2s timer. I’ll add capped backoff with jitter and keep the action queue across attempts.'],
  ['tool', 'Read', 'crates/tectr-client/src/connection.rs', '412 lines'],
  ['tool', 'Read', 'crates/tectr-client/src/queue.rs', '96 lines'],

const allTopics = () => WS.flatMap(w => w.topics);
for (const w of WS) for (const t of w.topics) {
  t.id = t.key; t.ws = w.id; t.panes = [t.tabs[0].id]; t.focusPane = 0; t.prev = null;
}

const S = {
  view: 'topic', topic: 'r',
  focus: 'main',      // sidebar | main | composer | terminal | newtopic
  cur: { type: 'topic', id: 'r' },
  hint: false, palette: null, picker: false, help: false, newWs: null,
  inboxCur: 0, flash: '', fade: null,
};
const scrolls = {};

const topicById = id => allTopics().find(t => t.id === id);
const tabById = (t, id) => t.tabs.find(x => x.id === id);
const curTopic = () => topicById(S.topic);
const curTab = () => { const t = curTopic(); return tabById(t, t.panes[t.focusPane]); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const ORDER = ['waiting', 'failed', 'working', 'idle', 'done', 'stale'];
function rollupTab(t) {
  const agents = t.tabs.filter(x => x.kind === 'agent');
  return agents.slice().sort((a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state))[0];
}
const rollup = t => rollupTab(t)?.state || 'idle';

function fmt(tab) {
  if (tab.state === 'stale' || tab.state === 'idle') return '';
  if (tab.state === 'done' || tab.state === 'failed') return tab.secs >= 3600 ? `${Math.floor(tab.secs / 3600)}h` : `${Math.floor(tab.secs / 60)}m`;
  return `${Math.floor(tab.secs / 60)}:${String(tab.secs % 60).padStart(2, '0')}`;
}

const waitingTabs = () => allTopics().flatMap(t => t.tabs.filter(x => x.kind === 'agent' && x.state === 'waiting').map(tab => ({ t, tab })));

// ------------------------------------------------------------- sidebar

function visibleRows() {
  const rows = [{ type: 'inbox' }];
  for (const w of WS) {
    rows.push({ type: 'ws', id: w.id });
    if (w.open) for (const t of w.topics) rows.push({ type: 'topic', id: t.id });
  }
  return rows;
}
const isCur = r => S.focus === 'sidebar'
  ? S.cur.type === r.type && S.cur.id === r.id
  : (S.view === 'inbox' ? r.type === 'inbox' : r.type === 'topic' && r.id === S.topic);

function renderSide() {
  const wc = waitingTabs().length;
  let tree = `<button class="srow ${isCur({ type: 'inbox' }) ? 'current' : ''}" data-inbox><span class="glyph">◎</span><span class="name">Inbox</span><span class="meta ${wc ? 'alert' : ''}">${wc}</span><span class="hk">⌘I</span></button>`;
  for (const w of WS) {
    const wait = w.topics.filter(t => rollup(t) === 'waiting').length;
    const fail = w.topics.filter(t => rollup(t) === 'failed').length;
    tree += `<button class="srow wsrow ${isCur({ type: 'ws', id: w.id }) ? 'current' : ''}" data-ws="${w.id}"><span class="chev">${w.open ? '▼' : '▶'}</span><span class="name">${w.name}</span>`;
    if (!w.open && wait) tree += `<span class="meta alert">${wait} waiting</span>`;
    else if (!w.open && fail) tree += `<span class="meta bad">${fail} failed</span>`;
    else if (!w.open) tree += `<span class="meta">${w.topics.length}</span>`;
    tree += `</button>`;
    if (w.open || S.hint) for (const t of w.topics) {
      const st = rollup(t), r = rollupTab(t);
      const meta = st === 'waiting' ? `<span class="meta alert">${fmt(r)}</span>` : st === 'failed' ? `<span class="meta bad">${fmt(r)}</span>` : '';
      tree += `<button class="srow topic ${st} ${isCur({ type: 'topic', id: t.id }) ? 'current' : ''} ${S.fade === t.id ? 'fade-off' : ''}" data-topic="${t.id}">${ICON[st]}<span class="name">${esc(t.name)}</span><span data-age="${t.id}">${meta}</span><span class="hint">${t.key}</span></button>`;
    }
    if (S.newWs === w.id) tree += `<div class="newtopic">${ICON.idle}<input id="newtopic" placeholder="New topic, Enter to create" spellcheck="false" autocomplete="off"></div>`;
  }
  document.getElementById('side').innerHTML = `

  document.getElementById('app').classList.toggle('sidefocus', S.focus === 'sidebar' || S.focus === 'newtopic');
  document.getElementById('app').classList.toggle('hinting', S.hint);
}

// ------------------------------------------------------------- panes

const pct = (t, span) => `${((span - Math.min(t, span)) / span * 100).toFixed(2)}%`;
function traceHTML(tab) {
  const span = tab.tr.from;
  const waits = (tab.tr.waits || []).map(([a, b]) => `<u style="left:${pct(a, span)};width:${((a - b) / span * 100).toFixed(2)}%"></u>`).join('');
  return waits + tab.ticks.map(({ t, k }) => `<i class="${k}" style="left:${pct(t, span)}"></i>`).join('');
}

function logFor(tab, topic) {
  if (tab.log) return tab.log;
  const last = /^(Editing|Reading|Running) (.*)$/.exec(tab.now || '');
  tab.log = !tab.tr ? [] : [
    ['you', topic.name + '.'],
    ['agent', tab.state === 'stale' ? 'Last known output before this machine went offline.' : 'Working through this in the topic’s worktree.'],
    last ? ['tool', { Editing: 'Edit', Reading: 'Read', Running: 'Run' }[last[1]], last[2], ''] : ['agent', tab.now + '.'],
  ];
  return tab.log;
}

function logHTML(log) {
  let html = '', tools = '';
  const flush = () => { if (tools) { html += `<div class="tools">${tools}</div>`; tools = ''; } };
  for (const e of log) {
    if (e[0] === 'tool') tools += `<div class="tool"><span class="k">${e[1]}</span><span class="p">${esc(e[2])}</span><span class="m${e[4] ? ' bad' : ''}">${e[3]}</span></div>`;
    else if (e[0] === 'note') tools += `<div class="tool"><span class="note">${esc(e[1])}</span></div>`;
    else {
      flush();
      if (e[0] === 'you') html += `<div class="you">${esc(e[1])}</div>`;
      if (e[0] === 'agent') html += `<div class="agent-msg">${esc(e[1])}</div>`;
    }
  }
  flush();
  return html || `<div class="empty">New agent in this topic’s worktree.<br>Type a prompt to start it.</div>`;
}

function decideHTML(tab) {
  if (tab.state !== 'waiting' || !tab.req) return '';
  const q = waitingTabs(), r = tab.req, pos = q.findIndex(x => x.tab === tab) + 1;
  const top = `<div class="decide-top">${ICON.waiting}${r.kind}<span class="pos">${pos} of ${q.length} waiting</span></div>`;
  if (r.opts) return `<div class="decide">${top}<div class="q">${r.q}</div><div class="opts">${r.opts.map((o, i) => `<button class="opt" data-opt="${i + 1}" data-tab="${tab.id}"><kbd>${i + 1}</kbd>${o}</button>`).join('')}</div></div>`;
  return `<div class="decide">${top}<pre>${esc(r.cmd)}</pre>${r.why ? `<div class="why">${r.why}</div>` : ''}
    <div class="actions">
      <button class="btn primary" data-approve="${tab.id}"><span>${r.risky ? 'Hold to approve' : 'Approve'}</span><kbd>Y</kbd></button>
      <button class="btn" data-always="${tab.id}"><span>Always</span><kbd>A</kbd></button>
      <button class="btn" data-deny="${tab.id}"><span>Deny</span><kbd>N</kbd></button>
    </div></div>`;
}

function agentPane(tab, topic) {
  const trace = tab.tr ? `<div class="tracebar"><div class="trace">${traceHTML(tab)}</div><div class="axis"><span>Started ${tab.tr.from}m ago</span><span>Now</span></div></div>` : '';
  return `${trace}
    <div class="log" data-scroll="${tab.id}"><div class="log-in">${logHTML(logFor(tab, topic))}</div></div>
    <div class="dock">${decideHTML(tab)}
      <div class="composer"><input data-composer="${tab.id}" value="${esc(tab.draft || '')}" placeholder="Message ${tab.engine}…" spellcheck="false" autocomplete="off"></div>
    </div>`;
}

function diffPane(tab) {
  let n = 0, flat = 0, activeFile = 0;
  tab.files.forEach((f, i) => f.hunks.forEach(() => { if (flat++ === tab.hunk) activeFile = i; }));
  const files = tab.files.map((f, i) => `<div class="file ${i === activeFile ? 'on' : ''}"><span>${esc(f.path)}</span><span class="n">+${f.add} −${f.del}</span></div>`).join('');
  const hunks = tab.files.map(f => `<div class="fname">${esc(f.path)}</div>` + f.hunks.map(h => {
    const idx = n++;
    return `<div class="diff hunk ${idx === tab.hunk ? 'on' : ''}" data-hunk="${idx}">${h.map(([c, t]) => `<div class="${c}">${esc(t)}</div>`).join('')}</div>`;
  }).join('')).join('');
  const comment = tab.commenting ? `<div class="dock comment"><div class="composer"><input data-composer="${tab.id}" value="${esc(tab.draft || '')}" placeholder="Comment on this hunk, sent to the agent…" spellcheck="false" autocomplete="off"></div></div>` : '';
  return `<div class="changes"><div class="files">${files}</div><div class="hunks" data-scroll="${tab.id}">${hunks}</div></div>${comment}`;
}

function termPane(tab, live) {
  const lines = tab.lines.map(l => l[0] === 'pr'
    ? `<div><span class="pr">${esc(l[1])}</span><span class="cmd">${esc(l[2])}</span></div>`
    : `<div class="${l[0]}">${esc(l[1])}</div>`).join('');
  const dir = tab.lines[0]?.[1] || '$ ';
  return `<div class="term" data-scroll="${tab.id}">${lines}<div><span class="pr">${esc(dir)}</span><span class="cmd">${esc(tab.input)}</span><span class="caret ${live ? 'live' : ''}"></span></div></div>`;
}

function tabHTML(tab, i, topic) {
  const shown = topic.panes.includes(tab.id);
  const active = shown && topic.panes[topic.focusPane] === tab.id && S.focus !== 'sidebar';
  const state = tab.kind === 'agent' ? tab.state : '';
  const lead = tab.kind === 'agent' ? ICON[tab.state] : `<span class="tk">${tab.kind === 'diff' ? '±' : '›_'}</span>`;
  const sub = tab.kind === 'diff' ? `<span class="sub">${esc(topic.delta)}</span>` : (tab.kind === 'agent' && tab.title !== tab.engine ? `<span class="sub">${tab.engine}</span>` : '');
  return `<button class="tab ${state} ${shown ? 'shown' : ''} ${active ? 'active' : ''}" data-gotab="${tab.id}">${lead}${esc(tab.title)}${sub}<span class="hk">⌘${i + 1}</span></button>`;
}

function renderInbox() {
  const q = waitingTabs();
  S.inboxCur = Math.max(0, Math.min(S.inboxCur, q.length - 1));
  const rows = q.map(({ t, tab }, i) => `<button class="inrow ${i === S.inboxCur && S.focus !== 'sidebar' ? 'on' : ''}" data-open="${t.id}" data-tabid="${tab.id}">${ICON.waiting}<span class="where">${esc(t.name)} <span>${WS.find(w => w.id === t.ws).name}</span></span><span class="what">${esc(tab.req?.cmd || tab.req?.q || tab.now)}</span><span class="age" data-tabage="${tab.id}">${fmt(tab)}</span></button>`).join('');
  return `<div class="head"><div class="crumb">Inbox</div><div class="info">Everything waiting on you, across all workspaces</div></div>
    <div class="tabs" style="height:1px;padding:0"></div>
    <div class="inbox">${rows || '<div class="empty" style="padding-top:80px">Nothing is waiting on you.</div>'}</div>`;
}

function footerHTML() {
  const k = (keys, label) => `<span>${keys.map(x => `<kbd>${x}</kbd>`).join('')} ${label}</span>`;
  let mode = 'Navigate', cls = '', hints = [];
  const tab = S.view === 'topic' ? curTab() : null;
  if (S.focus === 'newtopic') { mode = 'Typing'; cls = 'typing'; hints = [k(['↵'], 'create topic and worktree'), k(['Esc'], 'cancel')]; }
  else if (S.focus === 'sidebar') { mode = 'Sidebar'; hints = [k(['J', 'K'], 'move and open'), k(['↵'], 'go into topic'), k(['←', '→'], 'fold workspace'), k(['⌘N'], 'new topic')]; }
  else if (S.focus === 'composer') { mode = 'Typing'; cls = 'typing'; hints = [k(['↵'], 'send'), k(['Esc'], 'stop typing')]; }
  else if (S.focus === 'terminal') { mode = 'Terminal'; cls = 'typing'; hints = [k(['⌘Esc'], 'stop typing'), '<span>Keys go to the shell. ⌘ shortcuts still work.</span>']; }
  else if (S.view === 'inbox') hints = [k(['J', 'K'], 'move'), k(['↵'], 'open'), k(['Esc'], 'sidebar')];
  else if (tab.kind === 'agent' && tab.state === 'waiting' && tab.req?.opts) hints = [k(['1', '2'], 'answer'), k(['⇥'], 'next waiting'), k(['/'], 'reply'), k(['Esc'], 'sidebar')];
  else if (tab.kind === 'agent' && tab.state === 'waiting') hints = [k(['Y'], tab.req?.risky ? 'hold to approve' : 'approve'), k(['A'], 'always'), k(['N'], 'deny'), k(['⇥'], 'next waiting'), k(['Esc'], 'sidebar')];
  else if (tab.kind === 'agent') hints = [k(['/'], 'message'), k(['J', 'K'], 'scroll'), k(['⇥'], 'next waiting'), k(['Esc'], 'sidebar')];
  else if (tab.kind === 'diff') hints = [k(['J', 'K'], 'next hunk'), k(['C'], 'comment to agent'), k(['⌘\\'], 'split'), k(['Esc'], 'sidebar')];
  else hints = [k(['↵'], 'type in terminal'), k(['J', 'K'], 'scroll'), k(['Esc'], 'sidebar')];
  return `<div class="foot"><span class="mode ${cls}">${mode}</span>${S.flash ? `<span class="flash">${esc(S.flash)}</span>` : hints.join('')}<span class="right">Hold ⌘ for shortcuts · ${'<kbd>?</kbd>'} all · in this mock, ⌥ stands in for ⌘</span></div>`;
}

function renderMain() {
  const main = document.getElementById('main');
  main.querySelectorAll('[data-scroll]').forEach(el => {
    scrolls[el.dataset.scroll] = { top: el.scrollTop, bottom: el.scrollTop + el.clientHeight >= el.scrollHeight - 4 };
  });
  if (S.view === 'inbox') {
    main.innerHTML = renderInbox() + footerHTML();
    return;
  }
  const t = curTopic(), w = WS.find(x => x.id === t.ws);
  const panes = t.panes.map((id, i) => {
    const tab = tabById(t, id), focused = i === t.focusPane;
    const live = focused && S.focus === 'terminal';
    const body = tab.kind === 'agent' ? agentPane(tab, t) : tab.kind === 'diff' ? diffPane(tab) : termPane(tab, live);
    return `<section class="pane ${focused ? 'focused' : ''}" data-pane="${i}">${body}</section>`;
  }).join('');
  main.innerHTML = `
    <div class="head">
      <div class="crumb"><span>${w.name}</span><span>/</span>${esc(t.name)}</div>
      <div class="info">${t.machine} · <span class="code">${t.branch}</span></div>
      <button class="ghost">Merge</button>
    </div>
    <div class="tabs">${t.tabs.map((x, i) => tabHTML(x, i, t)).join('')}<button class="addtab" id="addtab" data-picker>+<span class="hk" style="left:24px;top:3px">⌘T</span></button>${S.picker ? pickerHTML() : ''}</div>
    <div class="panes ${t.panes.length > 1 ? 'split' : ''}">${panes}</div>
    ${footerHTML()}`;

  main.querySelectorAll('[data-scroll]').forEach(el => {
    const saved = scrolls[el.dataset.scroll];
    const toBottom = el.classList.contains('log') || el.classList.contains('term');
    el.scrollTop = !saved ? (toBottom ? el.scrollHeight : 0) : saved.bottom && toBottom ? el.scrollHeight : saved.top;
  });
  if (S.focus === 'composer') {
    const input = main.querySelector('.pane.focused [data-composer]');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  } else if (document.activeElement?.dataset?.composer) {
    document.activeElement.blur();
  }
}

const pickerHTML = () => {
  const a = document.getElementById('addtab');
  const left = a ? a.offsetLeft : 200;
  return `<div class="picker" style="left:${left}px;top:78px">
    <div>${ICON.idle}Claude<kbd>A</kbd></div>
    <div>${ICON.idle}Codex<kbd>C</kbd></div>
    <div><span class="glyph">›_</span>Terminal<kbd>T</kbd></div>
    <div><span class="glyph">±</span>Changes<kbd>D</kbd></div>
  </div>`;
};

const render = () => {
  renderSide();
  renderMain();
  if (S.focus === 'newtopic') document.getElementById('newtopic')?.focus();
};

let flashTimer;
function flash(msg) {
  S.flash = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { S.flash = ''; renderMain(); }, 2400);
  renderMain();
}

const arrival = tab => (tab.kind === 'term' ? 'terminal' : 'main');

function openTopic(id, { keepSidebar = false, tabId = null } = {}) {
  const t = topicById(id);
  const w = WS.find(x => x.id === t.ws);
  w.open = true;
  w.lastTopic = id;
  S.view = 'topic';
  S.topic = id;
  S.cur = { type: 'topic', id };
  if (tabId) gotoTabId(t, tabId, false);
  S.focus = keepSidebar ? 'sidebar' : arrival(curTab());
  render();
}

function gotoTabId(t, id, doRender = true) {
  const other = t.panes.indexOf(id);
  if (other >= 0) t.focusPane = other;
  else {
    t.prev = t.panes[t.focusPane];
    t.panes[t.focusPane] = id;
  }
  if (doRender) {
    S.focus = arrival(tabById(t, id));
    render();
  }
}

function gotoTabN(n) {
  if (S.view !== 'topic') return;
  const t = curTopic(), tab = t.tabs[n];
  if (tab) gotoTabId(t, tab.id);
}
function cycleTab(dir) {
  if (S.view !== 'topic') return;
  const t = curTopic(), i = t.tabs.findIndex(x => x.id === t.panes[t.focusPane]);
  gotoTabId(t, t.tabs[(i + dir + t.tabs.length) % t.tabs.length].id);
}

function moveTopic(dir) {
  const list = WS.filter(w => w.open).flatMap(w => w.topics);
  const i = list.findIndex(t => t.id === S.topic);
  const t = list[(i + dir + list.length) % list.length] || list[0];
  if (t) openTopic(t.id);
}
function moveWorkspace(dir) {
  const i = WS.findIndex(w => w.id === curTopic().ws);
  const w = WS[(i + dir + WS.length) % WS.length];
  openTopic(w.lastTopic || w.topics[0].id);
}

function nextWaiting() {
  const q = waitingTabs();
  if (!q.length) return flash('Nothing is waiting on you');
  const cur = S.view === 'topic' ? q.findIndex(x => x.tab === curTab()) : -1;
  const { t, tab } = q[(cur + 1) % q.length];
  openTopic(t.id, { tabId: tab.id });
}

function up() {
  if (S.focus === 'composer' || S.focus === 'terminal') S.focus = 'main';
  else if (S.focus === 'main') {
    S.focus = 'sidebar';
    S.cur = S.view === 'inbox' ? { type: 'inbox' } : { type: 'topic', id: S.topic };
    document.getElementById('app').classList.remove('noside');
  }
  const tab = S.view === 'topic' ? curTab() : null;
  if (tab?.commenting) tab.commenting = false;
  render();
}

function moveSidebar(dir) {
  const rows = visibleRows();
  let i = rows.findIndex(r => r.type === S.cur.type && r.id === S.cur.id);
  i = Math.max(0, Math.min(rows.length - 1, i + dir));
  S.cur = rows[i];
  if (S.cur.type === 'topic') { S.topic = S.cur.id; S.view = 'topic'; }
  if (S.cur.type === 'inbox') S.view = 'inbox';
  render();
}

function openInbox() {
  S.view = 'inbox';
  S.focus = 'main';
  S.inboxCur = 0;
  S.cur = { type: 'inbox' };
  render();
}

// ------------------------------------------------------------- tabs

function openPicker() {
  if (S.view !== 'topic') return flash('Open a topic first');
  S.picker = true;
  renderMain();
}

function pick(code) {
  S.picker = false;
  const t = curTopic();
  if (code === 'KeyD') return openChanges();
  let tab = null;
  if (code === 'KeyA' || code === 'KeyC') {
    const engine = code === 'KeyA' ? 'Claude' : 'Codex';
    tab = agent(engine, engine, 'idle', 0, '', null);
  } else if (code === 'KeyT') {
    const dir = '~/wt/' + t.branch.split('/').pop() + ' $ ';
    tab = terminal('zsh', [['pr', dir, 'echo ready'], ['', 'ready']]);
  }
  if (!tab) return render();
  t.tabs.push(tab);
  t.prev = t.panes[t.focusPane];
  t.panes[t.focusPane] = tab.id;
  S.focus = tab.kind === 'term' ? 'terminal' : 'composer';
  render();
}

function openChanges() {
  if (S.view !== 'topic') return flash('Open a topic first');
  const t = curTopic();
  let tab = t.tabs.find(x => x.kind === 'diff');
  if (!tab) {
    tab = changes(genericDiff(t.branch.split('/').pop() + '.rs', 12, 3));
    t.tabs.push(tab);
  }
  gotoTabId(t, tab.id);
}

function closeTab() {
  if (S.view !== 'topic') return;
  const t = curTopic(), tab = curTab();
  if (tab.kind === 'agent' && (tab.state === 'working' || tab.state === 'waiting')) return flash('This agent is still running, so its tab stays open');
  if (t.tabs.length === 1) return flash('A topic always keeps one tab');
  const i = t.tabs.indexOf(tab);
  t.tabs.splice(i, 1);
  if (t.panes.length > 1) { t.panes.splice(t.focusPane, 1); t.focusPane = 0; }
  else t.panes[0] = (tabById(t, t.prev) || t.tabs[Math.max(0, i - 1)]).id;
  S.focus = arrival(curTab());
  render();
}

function toggleSplit() {
  if (S.view !== 'topic') return;
  const t = curTopic();
  if (t.panes.length > 1) {
    t.panes = [t.panes[t.focusPane]];
    t.focusPane = 0;
  } else {
    const other = (t.prev && tabById(t, t.prev) && t.prev !== t.panes[0] ? t.prev : t.tabs.find(x => x.id !== t.panes[0])?.id);
    if (!other) return flash('Open another tab to split');
    t.panes = [t.panes[0], other];
    t.focusPane = 0;
  }
  S.focus = arrival(curTab());
  render();
}

function otherPane() {
  if (S.view !== 'topic') return;
  const t = curTopic();
  if (t.panes.length < 2) return;
  t.focusPane = 1 - t.focusPane;
  S.focus = arrival(curTab());
  render();
}

function createTopic(name) {
  const w = WS.find(x => x.id === S.newWs);
  const used = new Set(allTopics().map(t => t.key));
  const key = [...name.toLowerCase().replace(/[^a-z]/g, ''), ...'bfhijklnoqtxyz'].find(c => !used.has(c)) || 'z';
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const tab = agent('Claude', 'Claude', 'idle', 0, '', null);
  w.topics.push({ id: key, key, ws: w.id, name, machine: 'Laptop', branch: `${w.name}/${slug}`, delta: '+0 −0', tabs: [tab], panes: [tab.id], focusPane: 0, prev: null });
  S.newWs = null;
  S.topic = key;
  S.view = 'topic';
  S.cur = { type: 'topic', id: key };
  S.focus = 'composer';
  render();
}

// ------------------------------------------------------------- decisions

function settle(topic, tab, note) {
  tab.state = 'working';
  tab.secs = 0;
  tab.now = tab.req.next;
  tab.log.push(['note', note]);
  delete tab.req;
  S.fade = topic.id;
  render();
  setTimeout(() => { S.fade = null; }, 340);
}

let holdTimer = null;
function startApprove(tab) {
  if (!tab || tab.state !== 'waiting' || !tab.req || tab.req.opts) return;
  const t = curTopic();
  if (!tab.req.risky) return settle(t, tab, 'You approved this');
  if (holdTimer) return;
  document.querySelector(`[data-approve="${tab.id}"]`)?.classList.add('holding');
  holdTimer = setTimeout(() => { holdTimer = null; settle(t, tab, 'You approved this'); }, 500);
}
function cancelHold() {
  if (!holdTimer) return;
  clearTimeout(holdTimer);
  holdTimer = null;
  document.querySelector('.holding')?.classList.remove('holding');
}

// ------------------------------------------------------------- palette

function paletteItems() {
  const items = [];
  for (const w of WS) for (const t of w.topics) items.push({ label: t.name, sub: w.name, kind: 'Topic', run: () => openTopic(t.id) });
  if (S.view === 'topic') curTopic().tabs.forEach(tab => items.push({ label: tab.title, sub: curTopic().name, kind: tab.kind === 'agent' ? 'Agent' : tab.kind === 'diff' ? 'Diff' : 'Terminal', run: () => gotoTabId(curTopic(), tab.id) }));
  const cmd = (label, run) => items.push({ label, sub: '', kind: 'Command', run });
  cmd('New topic', () => newTopic());
  cmd('New terminal in this topic', () => pick('KeyT'));
  cmd('New Claude agent in this topic', () => pick('KeyA'));
  cmd('New Codex agent in this topic', () => pick('KeyC'));
  cmd('Open changes', openChanges);
  cmd('Open inbox', openInbox);
  cmd('Split or unsplit', toggleSplit);
  cmd('Show or hide sidebar', toggleSide);
  return items;
}
function paletteFilter() {
  const q = S.palette.q.toLowerCase();
  const fuzzy = s => { let i = 0; for (const c of s.toLowerCase()) if (c === q[i]) i++; return i === q.length; };
  return paletteItems().filter(x => fuzzy(x.label) || fuzzy(`${x.sub} ${x.label}`)).sort((a, b) => a.label.toLowerCase().includes(q) === b.label.toLowerCase().includes(q) ? 0 : a.label.toLowerCase().includes(q) ? -1 : 1).slice(0, 9);
}
function renderOverlay() {
  const root = document.getElementById('overlay');
  if (S.palette) {
    if (!root.querySelector('.palette')) {
      root.innerHTML = `<div class="scrim" data-close><div class="palette"><input id="pal-in" placeholder="Jump to a topic or tab, or run a command…" spellcheck="false" autocomplete="off"><div class="pal-list" id="pal-list"></div></div></div>`;
      document.getElementById('pal-in').focus();
    }
    const list = paletteFilter();
    S.palette.i = Math.max(0, Math.min(S.palette.i, list.length - 1));
    document.getElementById('pal-list').innerHTML = list.map((x, i) => `<div class="pal ${i === S.palette.i ? 'on' : ''}" data-pal="${i}">${esc(x.label)}<span class="sub">${esc(x.sub)}</span><span class="kind">${x.kind}</span></div>`).join('') || '<div class="pal"><span class="sub">No matches</span></div>';
  } else if (S.help) {
    const li = (label, ...keys) => `<li>${label}<span>${keys.map(x => `<kbd>${x}</kbd>`).join('')}</span></li>`;
    root.innerHTML = `<div class="scrim" style="padding-top:8vh" data-close><div class="help">
      <h3>Keyboard</h3><p>⌘ shortcuts work everywhere, even inside a terminal. Single keys only work when you aren’t typing. In this browser mock, press ⌥ wherever you see ⌘.</p>
      <div class="help-cols">
        <div><h4>Get anywhere</h4><ul>${li('Jump to a topic by its letter', '⌘G', 'letter')}${li('Jump or run anything', '⌘K')}${li('Next thing waiting on you', '⌘J')}${li('Inbox', '⌘I')}${li('Previous or next topic', '⌥↑', '⌥↓')}${li('Previous or next workspace', '⌥⇧↑', '⌥⇧↓')}</ul></div>
        <div><h4>Tabs</h4><ul>${li('Go to tab', '⌘1', '…', '⌘9')}${li('Previous or next tab', '⌘[', '⌘]')}${li('New tab, then A, C, T or D', '⌘T')}${li('Open changes', '⌘D')}${li('Close tab', '⌘W')}${li('Split, switch pane', '⌘\\', '⌘;')}</ul></div>
        <div><h4>Focus</h4><ul>${li('Go up a level', 'Esc')}${li('Go up from a terminal', '⌘Esc')}${li('Go in a level', '↵')}${li('Message the agent', '/')}${li('Show or hide sidebar', '⌘B')}${li('New topic', '⌘N')}</ul></div>
        <div><h4>Decide and review (when not typing)</h4><ul>${li('Approve, hold if risky', 'Y')}${li('Always, deny', 'A', 'N')}${li('Answer a question', '1', '2')}${li('Next waiting', '⇥')}${li('Move, by hunk in a diff', 'J', 'K')}${li('Comment on a hunk', 'C')}</ul></div>
      </div></div></div>`;
  } else root.innerHTML = '';
}

function toggleSide() {
  const app = document.getElementById('app');
  app.classList.toggle('noside');
  if (app.classList.contains('noside') && S.focus === 'sidebar') S.focus = S.view === 'topic' ? arrival(curTab()) : 'main';
  render();
}

function newTopic() {
  const ws = S.view === 'topic' ? curTopic().ws : WS[0].id;
  document.getElementById('app').classList.remove('noside');
  WS.find(w => w.id === ws).open = true;
  S.newWs = ws;
  S.focus = 'newtopic';
  render();
}

// ------------------------------------------------------------- keyboard

// Holding the modifier reveals shortcuts on the surface
let revealTimer = null;
const stopReveal = () => { clearTimeout(revealTimer); revealTimer = null; document.body.classList.remove('reveal'); };

function chord(code, shift) {
  if (code === 'ArrowUp' || code === 'ArrowDown') {
    const dir = code === 'ArrowUp' ? -1 : 1;
    if (S.view !== 'topic') openTopic(S.topic);
    else if (shift) moveWorkspace(dir);
    else moveTopic(dir);
    return true;
  }
  const digit = /^Digit([1-9])$/.exec(code);
  if (digit) { gotoTabN(+digit[1] - 1); return true; }
  const map = {
    KeyK: () => { S.palette = { q: '', i: 0 }; renderOverlay(); },
    KeyJ: nextWaiting,
    KeyG: () => { S.hint = true; render(); },
    KeyI: openInbox,
    KeyT: openPicker,
    KeyW: closeTab,
    KeyN: newTopic,
    KeyD: openChanges,
    KeyB: toggleSide,
    Backslash: toggleSplit,
    Semicolon: otherPane,
    BracketLeft: () => cycleTab(-1),
    BracketRight: () => cycleTab(1),
    Escape: up,
  };
  if (!map[code]) return false;
  map[code]();
  return true;
}

function onMainKey(e, k) {
  if (S.view === 'inbox') {
    const q = waitingTabs();
    if (k === 'j' || k === 'arrowdown') { S.inboxCur++; renderMain(); }
    else if (k === 'k' || k === 'arrowup') { S.inboxCur--; renderMain(); }
    else if (k === 'enter' && q[S.inboxCur]) openTopic(q[S.inboxCur].t.id, { tabId: q[S.inboxCur].tab.id });
    else if (k === 'escape') up();
    else if (e.key === 'Tab') { e.preventDefault(); nextWaiting(); }
    else return;
    e.preventDefault();
    return;
  }
  const t = curTopic(), tab = curTab();
  const scrollBox = document.querySelector('.pane.focused [data-scroll]');
  if (k === 'escape') up();
  else if (e.key === 'Tab') { e.preventDefault(); nextWaiting(); }
  else if (k === 'j' || k === 'arrowdown' || k === 'k' || k === 'arrowup') {
    e.preventDefault();
    const dir = k === 'j' || k === 'arrowdown' ? 1 : -1;
    if (tab.kind === 'diff') {
      const count = tab.files.reduce((n, f) => n + f.hunks.length, 0);
      tab.hunk = Math.max(0, Math.min(count - 1, tab.hunk + dir));
      renderMain();
      document.querySelector('.pane.focused .hunk.on')?.scrollIntoView({ block: 'nearest' });
    } else if (scrollBox) scrollBox.scrollTop += dir * 90;
  }
  else if (tab.kind === 'term' && (k === 'enter' || k === '/')) { e.preventDefault(); S.focus = 'terminal'; renderMain(); }
  else if (tab.kind === 'agent' && (k === 'enter' || k === '/')) { e.preventDefault(); S.focus = 'composer'; renderMain(); }
  else if (tab.kind === 'diff' && k === 'c') { e.preventDefault(); tab.commenting = true; S.focus = 'composer'; renderMain(); }
  else if (tab.kind === 'agent' && k === 'y' && !e.repeat) startApprove(tab);
  else if (tab.kind === 'agent' && k === 'a' && tab.state === 'waiting' && tab.req?.cmd) settle(t, tab, 'You approved always for this topic');
  else if (tab.kind === 'agent' && k === 'n' && tab.state === 'waiting' && tab.req?.cmd) settle(t, tab, 'You denied this');
  else if (tab.kind === 'agent' && (k === '1' || k === '2') && tab.req?.opts) settle(t, tab, `You answered: ${tab.req.opts[+k - 1].split(',')[0]}`);
}

function onSidebarKey(e, k) {
  if (k === 'j' || k === 'arrowdown') { e.preventDefault(); moveSidebar(1); }
  else if (k === 'k' || k === 'arrowup') { e.preventDefault(); moveSidebar(-1); }
  else if (k === 'arrowleft' || k === 'arrowright' || (k === 'enter' && S.cur.type === 'ws')) {
    e.preventDefault();
    if (S.cur.type === 'ws') {
      const w = WS.find(x => x.id === S.cur.id);
      w.open = k === 'enter' ? !w.open : k === 'arrowright';
      render();
    } else if (S.cur.type === 'topic' && k === 'arrowleft') {
      S.cur = { type: 'ws', id: curTopic().ws };
      render();
    } else if (k === 'arrowright') { S.focus = S.view === 'topic' ? arrival(curTab()) : 'main'; render(); }
  }
  else if (k === 'enter') { e.preventDefault(); S.focus = S.view === 'topic' ? arrival(curTab()) : 'main'; render(); }
}

function onTerminalKey(e) {
  const tab = curTab();
  e.preventDefault();
  if (e.key === 'Enter') {
    const dir = tab.lines[0]?.[1] || '$ ';
    tab.lines.push(['pr', dir, tab.input]);
    if (tab.input.trim()) tab.lines.push(['', `(mock terminal) ${tab.input.trim().split(' ')[0]}: not really running`]);
    tab.input = '';
    scrolls[tab.id] = null;
  } else if (e.key === 'Backspace') tab.input = tab.input.slice(0, -1);
  else if (e.key.length === 1) tab.input += e.key;
  else return;
  renderMain();
}

function onComposerKey(e) {
  const tab = curTab(), t = curTopic();
  if (e.key === 'Escape') { e.preventDefault(); up(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const text = (tab.draft || '').trim();
  if (!text) { up(); return; }
  tab.draft = '';
  if (tab.kind === 'diff') {
    const target = t.tabs.find(x => x.kind === 'agent');
    logFor(target, t).push(['you', `On this hunk: ${text}`]);
    tab.commenting = false;
    S.focus = 'main';
    flash(`Sent to ${target.engine}`);
    render();
    return;
  }
  logFor(tab, t).push(['you', text]);
  if (tab.state === 'idle') {
    tab.state = 'working';
    tab.secs = 0;
    tab.now = 'Reading the worktree';
    tab.tr = { from: 2, d: 2 };
    tab.ticks = [];
  }
  scrolls[tab.id] = null;
  S.focus = 'main';
  render();
}

addEventListener('keydown', e => {
  const { code, key } = e;
  const cmd = e.metaKey || e.altKey, k = key.toLowerCase();

  if (key === 'Alt' || key === 'Meta') {
    if (!revealTimer) revealTimer = setTimeout(() => document.body.classList.add('reveal'), 300);
    return;
  }
  stopReveal();

  if (S.hint) {
    e.preventDefault();
    S.hint = false;
    const m = /^Key([A-Z])$/.exec(code);
    const target = m && allTopics().find(t => t.key === m[1].toLowerCase());
    if (target) openTopic(target.id); else render();
    return;
  }
  if (S.help) {
    if (key === 'Escape' || key === '?') { e.preventDefault(); S.help = false; renderOverlay(); }
    return;
  }
  if (S.palette) {
    if (key === 'Escape' || (cmd && code === 'KeyK')) { e.preventDefault(); S.palette = null; renderOverlay(); }
    else if (key === 'ArrowDown' || (e.ctrlKey && code === 'KeyN')) { e.preventDefault(); S.palette.i++; renderOverlay(); }
    else if (key === 'ArrowUp' || (e.ctrlKey && code === 'KeyP')) { e.preventDefault(); S.palette.i--; renderOverlay(); }
    else if (key === 'Enter') {
      e.preventDefault();
      const item = paletteFilter()[S.palette.i];
      S.palette = null;
      renderOverlay();
      item?.run();
    }
    return;
  }
  if (S.picker) {
    e.preventDefault();
    if (key === 'Escape') { S.picker = false; renderMain(); } else pick(code);
    return;
  }
  if (S.focus === 'newtopic') {
    if (key === 'Escape') { e.preventDefault(); S.newWs = null; S.focus = 'main'; render(); }
    else if (key === 'Enter') { e.preventDefault(); const v = document.getElementById('newtopic').value.trim(); if (v) createTopic(v); }
    return;
  }

  if (cmd && chord(code, e.shiftKey)) { e.preventDefault(); return; }
  if (cmd || e.ctrlKey) return;

  if (S.focus === 'composer') return onComposerKey(e);
  if (S.focus === 'terminal') return onTerminalKey(e);
  if (key === '?') { e.preventDefault(); S.help = true; renderOverlay(); return; }
  if (S.focus === 'sidebar') return onSidebarKey(e, k);
  onMainKey(e, k);
});

addEventListener('keyup', e => {
  if (e.key === 'Alt' || e.key === 'Meta') stopReveal();
  if (e.code === 'KeyY') cancelHold();
});

// ------------------------------------------------------------- pointer

document.addEventListener('input', e => {
  if (e.target.id === 'pal-in') { S.palette.q = e.target.value; S.palette.i = 0; renderOverlay(); return; }
  const id = e.target.dataset?.composer;
  if (id && S.view === 'topic') { const tab = tabById(curTopic(), id); if (tab) tab.draft = e.target.value; }
});

document.addEventListener('focusin', e => {
  if (e.target.dataset?.composer && S.focus !== 'composer') {
    const pane = e.target.closest('[data-pane]');
    if (pane) curTopic().focusPane = +pane.dataset.pane;
    S.focus = 'composer';
    renderSide();
  }
});

document.addEventListener('click', e => {
  const el = e.target;
  const close = el.closest('[data-close]');
  if (close && el === close) { S.palette = null; S.help = false; renderOverlay(); return; }
  const pal = el.closest('[data-pal]');
  if (pal) { const item = paletteFilter()[+pal.dataset.pal]; S.palette = null; renderOverlay(); item?.run(); return; }
  if (el.closest('[data-palette]')) { S.palette = { q: '', i: 0 }; renderOverlay(); return; }
  if (el.closest('[data-inbox]')) return openInbox();
  const ws = el.closest('[data-ws]');
  if (ws) { const w = WS.find(x => x.id === ws.dataset.ws); w.open = !w.open; S.cur = { type: 'ws', id: w.id }; render(); return; }
  const top = el.closest('[data-topic]');
  if (top) return openTopic(top.dataset.topic);
  const gotab = el.closest('[data-gotab]');
  if (gotab) return gotoTabId(curTopic(), gotab.dataset.gotab);
  if (el.closest('[data-picker]')) return openPicker();
  const open = el.closest('[data-open]');
  if (open) return openTopic(open.dataset.open, { tabId: open.dataset.tabid });
  const opt = el.closest('[data-opt]');
  if (opt) { const tab = tabById(curTopic(), opt.dataset.tab); return settle(curTopic(), tab, `You answered: ${tab.req.opts[+opt.dataset.opt - 1].split(',')[0]}`); }
  const always = el.closest('[data-always]');
  if (always) return settle(curTopic(), tabById(curTopic(), always.dataset.always), 'You approved always for this topic');
  const deny = el.closest('[data-deny]');
  if (deny) return settle(curTopic(), tabById(curTopic(), deny.dataset.deny), 'You denied this');
  const pane = el.closest('[data-pane]');
  if (pane && !el.closest('input')) {
    const t = curTopic();
    t.focusPane = +pane.dataset.pane;
    S.focus = arrival(curTab());
    render();
  }
});

document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-approve]');
  if (b) startApprove(tabById(curTopic(), b.dataset.approve));
});
document.addEventListener('pointerup', cancelHold);

// ------------------------------------------------------------- scripted life

setInterval(() => {
  for (const t of allTopics()) for (const tab of t.tabs) {
    if (tab.kind === 'agent' && (tab.state === 'working' || tab.state === 'waiting')) tab.secs++;
  }
  for (const t of allTopics()) {
    const el = document.querySelector(`[data-age="${t.id}"] .meta`);
    if (el) el.textContent = fmt(rollupTab(t));
  }
  document.querySelectorAll('[data-tabage]').forEach(el => {
    for (const t of allTopics()) { const tab = tabById(t, el.dataset.tabage); if (tab) el.textContent = fmt(tab); }
  });
}, 1000);

const TARGETS = {
  Read: ['crates/daemon/src/acp.rs', 'ui/src/transcript/viewport.ts', 'crates/tectr-client/src/merge.rs'],
  Edit: ['crates/daemon/src/spawn.rs', 'ui/src/transcript/viewport.ts', 'crates/tectr-client/src/merge.rs'],
  Run: ['cargo check --workspace', 'cargo test --workspace', 'pnpm test'],
};
const TICK = { Read: 'r', Edit: 'e', Run: 'b' };
setInterval(() => {
  const live = allTopics().flatMap(t => t.tabs.filter(x => x.kind === 'agent' && x.state === 'working').map(tab => ({ t, tab })));
  if (!live.length) return;
  const { t, tab } = live[Math.floor(Math.random() * live.length)];
  const kind = Object.keys(TARGETS)[Math.floor(Math.random() * 3)];
  const path = TARGETS[kind][Math.floor(Math.random() * 3)];
  tab.ticks.push({ t: 0.02, k: TICK[kind] });
  logFor(tab, t).push(['tool', kind, path, '']);
  const visible = S.view === 'topic' && t.id === S.topic && t.panes.includes(tab.id);
  // Repainting would restart the fill on a button being held
  if (visible && !holdTimer) renderMain();
}, 1400);

// After 12 seconds an agent in the folded twig workspace blocks.
// Its workspace row shows the count, and ⌘J reaches it without unfolding anything by hand.
setTimeout(() => {
  const t = topicById('g'), tab = t.tabs[0];
  tab.state = 'waiting';
  tab.secs = 0;
  tab.now = 'Edit src/lib.rs';
  logFor(tab, t);
  tab.req = { kind: 'Edit file', cmd: 'src/lib.rs  +2 −0  add mod worktree;', next: 'Editing src/worktree.rs' };
  renderSide();
  if (S.view === 'inbox' || (S.view === 'topic' && curTab().state === 'waiting')) renderMain();
}, 12000);

render();
</script>
</body>
</html>
